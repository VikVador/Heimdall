WandB:
    "entity"  : ["sail-nyu"]
    "project" : ["heimdall-training-encoders"]
    "mode"    : ["online"]

# Resources of the jobs in cluster/jobs/encoders.sbatch
State:
    "saving" : [true]

    # Checkpoint of each modality to resume from, a key of MODALITIES
    "checkpoint_names":
        "glorys" : [null]
        "sst"    : [null]
        "sla"    : [null]

Training:
    "batch_size_per_step_glorys"       : [64]
    "batch_size_per_step_observations" : [256]
    "batch_size_per_gpu_glorys"        : [4]
    "batch_size_per_gpu_observations"  : [32]
    "steps_update"                     : [8192]
    "steps_logging"                    : [16]
    "steps_validation"                 : [512]
    "batches_validation"               : [16]
    "num_workers"                      : [4]
    "prefetch_factor"                  : [1]
    "learning_rate_start"              : [0.00002]
    "learning_rate_peak"               : [0.00080]
    "learning_rate_end"                : [0.00001]
    "warmup_steps"                     : [512]

Model:
    "lat_channels" : [256]

    "config_glorys":
        "hid_channels"  : [[32, 64, 128, 128, 256]]
        "hid_blocks"    : [[3, 3, 3, 3, 3]]
        "hid_groups"    : [[0, 0, 0, 0, 0]]
        "kernel_size"   : [3]
        "stride"        : [2]
        "ffn_factor"    : [1]
        "dropout"       : [0.02]
        "checkpointing" : [true]

    "config_observations":
        "hid_channels"  : [[32, 64, 128, 128, 256]]
        "hid_blocks"    : [[3, 3, 3, 3, 3]]
        "hid_groups"    : [[0, 0, 0, 0, 0]]
        "kernel_size"   : [3]
        "stride"        : [2]
        "ffn_factor"    : [1]
        "dropout"       : [0.02]
        "checkpointing" : [true]
