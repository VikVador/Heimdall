# One section per dataset: its trained encoder (a run of PATH_MODELS and one of its checkpoints, the run null until
# trained), the splits to encode, and the loading of its days

glorys:
    "run"             : [null]
    "checkpoint"      : ["best-validation"]
    "splits"          : [["training", "validation", "test"]]
    "batch_size"      : [4]
    "num_workers"     : [4]
    "prefetch_factor" : [2]

