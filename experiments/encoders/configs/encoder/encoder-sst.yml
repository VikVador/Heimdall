Base : "common-observations.yml"

State:
    "checkpoint_name" : [null]

Training:
    "batch_size_per_gpu" : [16]
    "steps_update"       : [16384]
    "steps_validation"   : [512]
    "steps_checkpoint"   : [512]

Model:
    "modality"      : ["sst"]
    "coarsening"    : [1]
    "checkpointing" : [false]
    "dropout"       : [0.00]
    "ffn_factor"    : [1]
    "kernel_size"   : [3]
    "patch_size"    : [1]
    "periodic"      : [[-1]]
    "lat_channels"  : [128]
    "hid_channels"  : [[8, 16, 32, 64, 128, 256]]
    "hid_blocks"    : [[3, 3, 3, 3, 3, 3]]
    "stride"        : [[
        [2, 2],
        [2, 2],
        [2, 2],
        [2, 2],
        [2, 2],
    ]]
